<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Discord Context Bridgeの処理フロー</title>
  <desc id="desc">Discordで対象を見つけ、ローカルへ安全に保存し、AIが文脈を整理し、人間が最終判断する流れ</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <text x="60" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="700">会話を外へ出さず、判断できる文脈へ</text>
  <text x="60" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">local-first · read-only · human-in-the-loop</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="60" y="125" width="225" height="115" rx="18" fill="#5865f2"/>
    <text x="172.5" y="166" fill="white" font-size="16" text-anchor="middle">1</text>
    <text x="172.5" y="197" fill="white" font-size="23" font-weight="700" text-anchor="middle">見つける</text>
    <text x="172.5" y="221" fill="#e0e7ff" font-size="14" text-anchor="middle">Discordで対象を選ぶ</text>

    <rect x="345" y="125" width="225" height="115" rx="18" fill="#0f766e"/>
    <text x="457.5" y="166" fill="white" font-size="16" text-anchor="middle">2</text>
    <text x="457.5" y="197" fill="white" font-size="23" font-weight="700" text-anchor="middle">保存する</text>
    <text x="457.5" y="221" fill="#ccfbf1" font-size="14" text-anchor="middle">privateな台帳へ追記</text>

    <rect x="630" y="125" width="225" height="115" rx="18" fill="#7c3aed"/>
    <text x="742.5" y="166" fill="white" font-size="16" text-anchor="middle">3</text>
    <text x="742.5" y="197" fill="white" font-size="23" font-weight="700" text-anchor="middle">理解する</text>
    <text x="742.5" y="221" fill="#ede9fe" font-size="14" text-anchor="middle">AIが前提と流れを整理</text>

    <rect x="915" y="125" width="225" height="115" rx="18" fill="#b45309"/>
    <text x="1027.5" y="166" fill="white" font-size="16" text-anchor="middle">4</text>
    <text x="1027.5" y="197" fill="white" font-size="23" font-weight="700" text-anchor="middle">判断する</text>
    <text x="1027.5" y="221" fill="#fef3c7" font-size="14" text-anchor="middle">人間が返信・行動を決定</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M295 182h36"/><path d="m323 172 10 10-10 10"/>
    <path d="M580 182h36"/><path d="m608 172 10 10-10 10"/>
    <path d="M865 182h36"/><path d="m893 172 10 10-10 10"/>
  </g>
</svg>
