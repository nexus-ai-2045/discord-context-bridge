name: 文書検査
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          for file in README.md CONTRIBUTING.md SECURITY.md PREFLIGHT.md LICENSE; do
            test -s "$file" || exit 1
          done
