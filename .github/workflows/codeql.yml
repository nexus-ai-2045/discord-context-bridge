name: Python security scan (Bandit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: 固定版のBanditを準備
        run: python -m pip install "bandit[toml]==1.9.4"

      - name: 中以上の重要度・確信度の指摘で検査を失敗させる
        run: bandit -r src -ll -ii -f json -o "${RUNNER_TEMP}/bandit-results.json"

      - name: 検査結果と走査完了を確認
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bandit-results.json").read_text())
          if not isinstance(report, dict):
              raise SystemExit("Bandit report must be an object")
          metrics = report.get("metrics")
          totals = metrics.get("_totals") if isinstance(metrics, dict) else None
          expected_files = {path.as_posix() for path in Path("src").rglob("*.py")}
          scanned_files = set(metrics) - {"_totals"} if isinstance(metrics, dict) else set()
          if (
              not isinstance(report.get("errors"), list)
              or report["errors"]
              or not isinstance(report.get("results"), list)
              or report["results"]
              or not isinstance(totals, dict)
              or type(totals.get("loc")) is not int
              or totals["loc"] <= 0
              or type(totals.get("skipped_tests")) is not int
              or totals["skipped_tests"] != 0
              or type(totals.get("nosec")) is not int
              or totals["nosec"] != 0
              or not expected_files
              or scanned_files != expected_files
          ):
              raise SystemExit("Bandit report contains findings, errors, or incomplete coverage")
          PY

      - name: 解析結果を非公開の検査成果物へ保存
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bandit-results
          path: ${{ runner.temp }}/bandit-results.json
          if-no-files-found: error
          retention-days: 1
