name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mcp]'
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Check version consistency
        run: python scripts/bump_version.py --check

      - name: Check whitespace-safe diff
        run: git diff --check

  local-ops-check:
    name: Local ops check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Install operational check tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run repository operational checks
        run: python scripts/ops_check.py --skip-http

  mcp-compatibility:
    name: MCP ${{ matrix.mcp-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version:
          - "==1.28.*"
          - ">=2,<3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MCP compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "mcp${{ matrix.mcp-version }}"

      - name: Run MCP compatibility tests
        run: >-
          python -m pytest
          tests/test_core.py
          tests/test_mcp_http_auth.py
          tests/test_reply_context_contract.py
          -q
