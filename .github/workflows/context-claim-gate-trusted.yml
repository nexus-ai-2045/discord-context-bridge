name: Context claim gate trusted audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-context-claim-gate:
    name: Trusted context claim gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base guard
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Check out candidate without executing it
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Audit candidate with trusted base code
        run: >-
          python trusted-base/scripts/verify_context_claim_gate_head.py
          --head-root candidate
          --json
